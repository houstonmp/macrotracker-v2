<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="healthapp.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Health App</title>
</head>

<body>
  <!-- Apply the saved theme before anything draws; see src/assets/themeCache.js -->
  <script>
    (function () {
      var theme = null;
      try { theme = JSON.parse(localStorage.getItem('fitpad-theme')); } catch (error) { }
      if (!theme || !theme.lightMode || !theme.themeName) {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = { lightMode: dark ? 'dark' : 'light', themeName: 'teal' };
      }
      document.body.className = theme.lightMode + ' ' + theme.themeName;
    })();
  </script>
  <div id="root"></div>
  <div id="overlays"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
